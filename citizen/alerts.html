<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow | Hyderabad Traffic Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }
        
        .nav-glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }
        
        .gradient-text {
            background: linear-gradient(90deg, #48CAE4, #3A86FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 15px #3A86FF;
        }
        
        .alert-critical {
            border-left: 4px solid #ef233c;
            animation: pulseCritical 2s infinite;
        }
        
        .alert-warning {
            border-left: 4px solid #f77f00;
        }
        
        .alert-info {
            border-left: 4px solid #3a86ff;
        }
        
        @keyframes pulseCritical {
            0% { box-shadow: 0 0 0 0 rgba(239, 35, 60, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 35, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 35, 60, 0); }
        }
        
        .slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }
        
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(58, 134, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(58, 134, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(58, 134, 255, 0); }
        }
    </style>
</head>
<body>
    <!-- Particle.js Background -->
    <div id="particles-js"></div>
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-blue-400 text-lg">Loading Hyderabad Traffic Alerts...</p>
        </div>
    </div>
    
    <!-- Navigation -->
    <nav class="nav-glass fixed top-0 left-0 right-0 z-40 py-4 px-6 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-traffic-light text-blue-400 text-2xl"></i>
                <h1 class="text-2xl font-bold gradient-text">UrbanFlow Hyderabad</h1>
            </div>
            
            <div class="hidden md:flex space-x-8">
                <a href="index.html" class="text-blue-200 hover:text-white transition-colors">
                    <i class="fas fa-home mr-2"></i> Dashboard
                </a>
                <a href="#" class="text-white">
                    <i class="fas fa-bell mr-2"></i> Alerts
                </a>
                <a href="routes.html" class="text-blue-200 hover:text-white transition-colors">
                    <i class="fas fa-route mr-2"></i> Routes
                </a>
                <a href="profile.html" class="text-blue-200 hover:text-white transition-colors">
                    <i class="fas fa-user mr-2"></i> Profile
                </a>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <button id="reportAlertBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg flex items-center btn-glow transition-all">
                        <i class="fas fa-plus mr-2"></i> Report Alert
                    </button>
                </div>
                <div class="relative">
                    <img id="profileImage" src="https://thumbs.dreamstime.com/b/default-avatar-profile-icon-vector-social-media-user-image-182145777.jpg" 
                         alt="Profile" class="w-10 h-10 rounded-full cursor-pointer border-2 border-blue-400">
                    
                    <div id="dropdownMenu" class="absolute right-0 mt-2 w-48 bg-slate-800 rounded-lg shadow-xl py-2 hidden">
                        <a href="#" class="block px-4 py-2 text-blue-200 hover:bg-slate-700">Profile</a>
                        <a href="#" class="block px-4 py-2 text-blue-200 hover:bg-slate-700">Settings</a>
                        <a href="#" id="logout-btn" class="block px-4 py-2 text-red-400 hover:bg-slate-700">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="pt-24 pb-12 px-6 max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-8 slide-in" style="animation-delay: 0.1s;">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-4xl font-bold mb-2">Hyderabad Traffic Alerts</h1>
                    <p class="text-blue-200">Real-time updates on Hyderabad traffic conditions</p>
                    <div class="mt-2 flex items-center text-sm text-blue-300">
                        <i class="fas fa-clock mr-2"></i>
                        <span id="lastUpdated">Last updated: Just now</span>
                    </div>
                </div>
                <div class="flex space-x-3">
                    <button id="filterBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg flex items-center btn-glow transition-all">
                        <i class="fas fa-filter mr-2"></i> Filter
                    </button>
                    <button id="refreshAlertsBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg flex items-center btn-glow transition-all">
                        <i class="fas fa-sync-alt mr-2"></i> Refresh
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Alerts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="alertsContainer">
            <!-- Alerts will be loaded dynamically here -->
            <div class="text-center py-12">
                <div class="loading-spinner mx-auto mb-4"></div>
                <p class="text-blue-400">Loading Hyderabad traffic alerts...</p>
            </div>
        </div>
    </main>
    
    <!-- Report Alert Modal -->
    <div id="reportModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
        <div class="bg-slate-800 rounded-xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Report Traffic Alert</h2>
                <button id="closeReportModal" class="text-blue-200 hover:text-white text-2xl">&times;</button>
            </div>
            <form id="reportForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-blue-200 mb-1">Alert Type</label>
                    <select id="alertType" class="bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="accident">Accident</option>
                        <option value="congestion">Traffic Jam</option>
                        <option value="construction">Road Work</option>
                        <option value="hazard">Road Hazard</option>
                        <option value="event">Special Event</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-blue-200 mb-1">Location</label>
                    <input type="text" id="alertLocation" placeholder="E.g.: Hitech City, Tank Bund Road" 
                           class="bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-blue-200 mb-1">Severity</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center">
                            <input type="radio" name="severity" value="low" class="mr-2">
                            <span>Low</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="severity" value="medium" checked class="mr-2">
                            <span>Medium</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="severity" value="high" class="mr-2">
                            <span>High</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-blue-200 mb-1">Description</label>
                    <textarea id="alertDescription" rows="3" placeholder="Provide details about the traffic issue" 
                              class="bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg btn-glow transition-all">
                    Submit Alert
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // Hyderabad-specific alert data (in a real app, this would come from an API)
        const hyderabadAlerts = {
            critical: [
                {
                    id: 1,
                    type: "accident",
                    title: "Multi-vehicle collision",
                    location: "PVNR Expressway near Gachibowli",
                    description: "3-car collision blocking two lanes",
                    time: "15 mins ago",
                    severity: "high",
                    clearance: "45 mins",
                    response: "Police and ambulance en route"
                },
                {
                    id: 2,
                    type: "hazard",
                    title: "Overhead cable damage",
                    location: "Banjara Hills Road No. 12",
                    description: "Fallen cables blocking traffic",
                    time: "30 mins ago",
                    severity: "high",
                    clearance: "1 hour",
                    response: "GHMC teams dispatched"
                }
            ],
            warning: [
                {
                    id: 3,
                    type: "construction",
                    title: "Metro rail work",
                    location: "Ameerpet to Panjagutta corridor",
                    description: "Lane restrictions until December",
                    time: "2 hours ago",
                    severity: "medium",
                    impact: "20 min delays expected"
                },
                {
                    id: 4,
                    type: "congestion",
                    title: "Heavy traffic",
                    location: "Tank Bund during rush hour",
                    description: "Usual evening congestion",
                    time: "1 hour ago",
                    severity: "medium",
                    impact: "Slower than usual"
                }
            ],
            info: [
                {
                    id: 5,
                    type: "event",
                    title: "Ganesh immersion",
                    location: "Hussain Sagar procession routes",
                    description: "Road closures until midnight",
                    time: "3 hours ago",
                    severity: "low",
                    impact: "Plan alternate routes"
                },
                {
                    id: 6,
                    type: "weather",
                    title: "Heavy rain alert",
                    location: "Entire Hyderabad region",
                    description: "IMD predicts heavy showers",
                    time: "5 hours ago",
                    severity: "low",
                    impact: "Possible waterlogging"
                }
            ]
        };

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate loading
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                initParticles();
                loadAlerts();
                setupEventListeners();
                startLiveUpdates();
            }, 1500);
        });

        function initParticles() {
            particlesJS('particles-js', {
                "particles": {
                    "number": {
                        "value": 80,
                        "density": {
                            "enable": true,
                            "value_area": 800
                        }
                    },
                    "color": {
                        "value": "#3b82f6"
                    },
                    "shape": {
                        "type": "circle"
                    },
                    "opacity": {
                        "value": 0.3
                    },
                    "size": {
                        "value": 3,
                        "random": true
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 150,
                        "color": "#3b82f6",
                        "opacity": 0.2,
                        "width": 1
                    },
                    "move": {
                        "enable": true,
                        "speed": 2
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        }
                    }
                }
            });
        }

        function loadAlerts() {
            const container = document.getElementById('alertsContainer');
            container.innerHTML = '';

            // Critical Alerts Section
            const criticalSection = document.createElement('div');
            criticalSection.className = 'slide-in';
            criticalSection.style.animationDelay = '0.2s';
            criticalSection.innerHTML = `
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <span class="w-3 h-3 bg-red-500 rounded-full mr-2 pulse-animation"></span>
                    Critical Alerts
                </h2>
                <div class="space-y-4" id="criticalAlerts"></div>
            `;
            container.appendChild(criticalSection);

            // Warning Alerts Section
            const warningSection = document.createElement('div');
            warningSection.className = 'slide-in';
            warningSection.style.animationDelay = '0.3s';
            warningSection.innerHTML = `
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <span class="w-3 h-3 bg-yellow-500 rounded-full mr-2"></span>
                    Warning Alerts
                </h2>
                <div class="space-y-4" id="warningAlerts"></div>
            `;
            container.appendChild(warningSection);

            // Info Alerts Section
            const infoSection = document.createElement('div');
            infoSection.className = 'slide-in lg:col-span-2';
            infoSection.style.animationDelay = '0.4s';
            infoSection.innerHTML = `
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <span class="w-3 h-3 bg-blue-500 rounded-full mr-2"></span>
                    Information Alerts
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="infoAlerts"></div>
            `;
            container.appendChild(infoSection);

            // Populate alerts
            populateAlerts('critical', hyderabadAlerts.critical);
            populateAlerts('warning', hyderabadAlerts.warning);
            populateAlerts('info', hyderabadAlerts.info);

            // Update timestamp
            updateTimestamp();
        }

        function populateAlerts(type, alerts) {
            const container = document.getElementById(`${type}Alerts`);
            
            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-blue-400">
                        No ${type} alerts currently
                    </div>
                `;
                return;
            }

            alerts.forEach(alert => {
                const alertElement = document.createElement('div');
                alertElement.className = `glass-card alert-${type} rounded-lg p-5 hover:bg-slate-800/70 transition-colors`;
                
                const icon = getAlertIcon(alert.type);
                const severityClass = getSeverityClass(alert.severity);
                
                alertElement.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center mb-2">
                                <i class="fas ${icon} ${type === 'critical' ? 'text-red-400' : type === 'warning' ? 'text-yellow-400' : 'text-blue-400'} mr-2"></i>
                                <h3 class="font-semibold">${alert.title}</h3>
                            </div>
                            <p class="text-sm text-blue-200 mb-3">${alert.location}</p>
                            <div class="flex flex-wrap gap-2">
                                <span class="${severityClass} px-2 py-1 rounded text-xs">${alert.severity.toUpperCase()}</span>
                                ${alert.type !== 'weather' ? `<span class="bg-slate-700 text-blue-200 px-2 py-1 rounded text-xs">${alert.type.toUpperCase()}</span>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-blue-200 mb-1">${alert.time}</div>
                            <div class="${type === 'critical' ? 'text-red-400' : type === 'warning' ? 'text-yellow-400' : 'text-blue-400'} text-sm">
                                ${type === 'critical' ? `Response: ${alert.response}` : `Impact: ${alert.impact}`}
                            </div>
                        </div>
                    </div>
                    ${type !== 'info' ? `
                    <div class="mt-4 flex justify-between items-center">
                        <div class="flex items-center text-sm">
                            <i class="fas fa-clock text-blue-200 mr-1"></i>
                            <span>Est. clearance: ${alert.clearance}</span>
                        </div>
                        <button class="text-blue-400 hover:text-blue-300 text-sm flex items-center view-alert-btn" data-id="${alert.id}">
                            Details <i class="fas fa-chevron-right ml-1"></i>
                        </button>
                    </div>
                    ` : ''}
                `;
                
                container.appendChild(alertElement);
            });
        }

        function getAlertIcon(type) {
            switch(type) {
                case 'accident': return 'fa-car-crash';
                case 'construction': return 'fa-road';
                case 'congestion': return 'fa-traffic-light';
                case 'hazard': return 'fa-triangle-exclamation';
                case 'event': return 'fa-calendar-alt';
                case 'weather': return 'fa-cloud-rain';
                default: return 'fa-circle-exclamation';
            }
        }

        function getSeverityClass(severity) {
            switch(severity) {
                case 'high': return 'bg-red-600/20 text-red-400';
                case 'medium': return 'bg-yellow-600/20 text-yellow-400';
                default: return 'bg-blue-600/20 text-blue-400';
            }
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('lastUpdated').textContent = 
                `Last updated: ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }

        function setupEventListeners() {
            // Report alert button
            document.getElementById('reportAlertBtn').addEventListener('click', () => {
                document.getElementById('reportModal').classList.remove('hidden');
            });
            
            // Close report modal
            document.getElementById('closeReportModal').addEventListener('click', () => {
                document.getElementById('reportModal').classList.add('hidden');
            });
            
            // Refresh alerts
            document.getElementById('refreshAlertsBtn').addEventListener('click', () => {
                refreshAlerts();
            });
            
            // Profile dropdown
            const profileImage = document.getElementById("profileImage");
            const dropdownMenu = document.getElementById("dropdownMenu");
            
            profileImage.addEventListener("click", (event) => {
                event.stopPropagation();
                dropdownMenu.classList.toggle("hidden");
            });
            
            document.addEventListener("click", (event) => {
                if (!profileImage.contains(event.target)) {
                    dropdownMenu.classList.add("hidden");
                }
            });
        }

        function refreshAlerts() {
            const btn = document.getElementById('refreshAlertsBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Refreshing';
            btn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                loadAlerts();
                btn.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> Refresh';
                btn.disabled = false;
                
                // Show notification
                showNotification('Alerts refreshed successfully');
            }, 1000);
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-4 right-4 text-white px-4 py-2 rounded-lg shadow-lg flex items-center animate-fade-in';
            
            const typeClasses = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                warning: 'bg-yellow-600',
                info: 'bg-blue-600'
            };
            notification.classList.add(typeClasses[type] || typeClasses.success);
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            const icon = icons[type] || icons.success;
            
            notification.innerHTML = `
                <i class="fas ${icon} mr-2"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('animate-fade-out');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function startLiveUpdates() {
            // Simulate live updates every 30 seconds
            setInterval(() => {
                updateTimestamp();
                
                // In a real app, we would fetch fresh data here
                // For demo, we'll just rotate some alert statuses
                const criticalAlerts = document.querySelectorAll('.alert-critical');
                criticalAlerts.forEach(alert => {
                    const status = alert.querySelector('.text-red-400');
                    if (status) {
                        const responses = ["En route", "On scene", "Clearing"];
                        status.textContent = `Response: ${responses[Math.floor(Math.random() * responses.length)]}`;
                    }
                });
            }, 30000);
        }
    </script>
    <script type="module">
        // Firebase Integration (for real implementations)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // Firebase config (replace with your actual config)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // In a real implementation, you would:
        // 1. Listen for real-time updates from Firestore
        // 2. Submit new alerts to Firestore
        // 3. Handle user authentication
        
        // Example of real-time listener:
        /*
        onSnapshot(collection(db, "hyderabadAlerts"), (snapshot) => {
            const alerts = [];
            snapshot.forEach((doc) => {
                alerts.push({ id: doc.id, ...doc.data() });
            });
            // Update UI with new alerts
        });
        */
        
        // Example of submitting an alert:
        document.getElementById('reportForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const type = document.getElementById('alertType').value;
            const location = document.getElementById('alertLocation').value;
            const severity = document.querySelector('input[name="severity"]:checked').value;
            const description = document.getElementById('alertDescription').value;
            
            try {
                await addDoc(collection(db, "reportedAlerts"), {
                    type,
                    location,
                    severity,
                    description,
                    timestamp: new Date(),
                    status: "pending",
                    city: "Hyderabad"
                });
                
                showNotification('Alert reported successfully!');
                document.getElementById('reportModal').classList.add('hidden');
                document.getElementById('reportForm').reset();
            } catch (error) {
                showNotification('Error reporting alert', 'error');
                console.error("Error adding document: ", error);
            }
        });
    </script>
</body>
</html>
